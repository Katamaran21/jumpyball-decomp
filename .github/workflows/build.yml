name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Strict C89 conformance
        run: |
          sdl=$(pkg-config --cflags sdl2 | sed 's/-I/-isystem /g')
          for f in *.c; do
            # jb_platform_win32.c and jb_audio_win32.c include windows.h, which
            # this host has no copy of, and the Windows SDK headers are not C89
            # anyway.  The windows-native job below compiles them for real.
            case "$f" in *_win32.c) continue;; esac
            gcc -std=c89 -pedantic-errors -Wall -Wextra $sdl -c "$f" -o /dev/null
          done

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Headless frame dump
        run: |
          cd build
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            timeout 60 ./jumpyball 1 frame.raw
          rc=$?
          set -e
          echo "jumpyball exit code: $rc"
          test "$rc" = 0
          expected=$((240 * 320 * 2))
          actual=$(stat -c%s frame.raw)
          test "$actual" = "$expected" || {
            echo "frame.raw is $actual bytes, expected $expected"
            exit 1
          }

      - name: Headless frame dump with the touch overlay
        run: |
          cd build
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy JUMPYBALL_TOUCH=1 \
            timeout 60 ./jumpyball 1 touch.raw
          rc=$?
          set -e
          echo "jumpyball exit code: $rc"
          test "$rc" = 0
          expected=$((240 * 320 * 2))
          actual=$(stat -c%s touch.raw)
          test "$actual" = "$expected" || {
            echo "touch.raw is $actual bytes, expected $expected"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-linux-${{ matrix.arch }}
          path: |
            build/jumpyball
            build/BITMAP
            build/Sounds
            build/Musics

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86
            platform: Win32
            triplet: x86-windows
          - runner: windows-11-arm
            arch: arm64
            platform: ARM64
            triplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: vcpkg install sdl2:${{ matrix.triplet }}

      - name: Build
        run: |
          cmake -S . -B build -A ${{ matrix.platform }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build --config Release

      - name: Headless frame dump
        run: |
          cd build/Release
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\jumpyball.exe -ArgumentList '1','frame.raw' -Wait -PassThru
          "jumpyball exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $expected = 240 * 320 * 2
          $actual = (Get-Item frame.raw).Length
          if ($actual -ne $expected) {
            "frame.raw is $actual bytes, expected $expected"
            exit 1
          }

      # The same sources with JUMPYBALL_BACKEND=win32: GDI and waveOut, no SDL2.
      # Build only - the runner has no interactive desktop to present to.
      - name: Build the native Win32 backend
        run: |
          cmake -S . -B build-native -A ${{ matrix.platform }} `
            -DJUMPYBALL_BACKEND=win32
          cmake --build build-native --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-windows-native-${{ matrix.arch }}
          path: |
            build-native/Release/jumpyball.exe
            build-native/Release/BITMAP
            build-native/Release/Sounds
            build-native/Release/Musics

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-windows-${{ matrix.arch }}
          path: |
            build/Release/jumpyball.exe
            build/Release/SDL2.dll
            build/Release/BITMAP
            build/Release/Sounds
            build/Release/Musics

  windows-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 and Wine
        run: |
          # The wine command comes from the "wine" package; "wine64" ships no
          # binaries of its own.  Creating a prefix also runs the 32-bit
          # rundll32 over wine.inf, so the i386 side has to be there or the
          # prefix is left half-built and every later run fails.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine32:i386 wine64 xvfb

      - name: Build
        run: MINGW_PREFIX=x86_64-w64-mingw32 sh tools/build_win32.sh

      - name: Headless frame dump under Wine
        run: |
          cd build-win32
          export WINEPREFIX="$PWD/.wine"
          export WINEARCH=win64
          # Keep err: messages; only the fixme noise is worth hiding here.
          export WINEDEBUG=fixme-all
          # Build the prefix in its own step and wait for the server to exit,
          # so a first-run failure is reported as such instead of surfacing as
          # a confusing exit code from the game.
          xvfb-run -a wineboot --init
          wineserver -w
          # Platform_Init really does call CreateWindowExW, GetDC and
          # SetForegroundWindow, so hand it an X server rather than trusting
          # Wine's null display driver to fake all three.
          set +e
          xvfb-run -a timeout 180 wine jumpyball.exe 1 frame.raw
          rc=$?
          set -e
          echo "jumpyball exit code: $rc"
          test "$rc" = 0
          expected=$((240 * 320 * 2))
          actual=$(stat -c%s frame.raw)
          test "$actual" = "$expected" || {
            echo "frame.raw is $actual bytes, expected $expected"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-windows-native-mingw
          path: |
            build-win32/jumpyball.exe
            build-win32/BITMAP
            build-win32/Sounds
            build-win32/Musics

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble the Gradle project
        run: sh tools/android_prepare.sh

      - name: Build APK
        working-directory: build-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the APK payload
        run: |
          apk=$(ls build-android/app/build/outputs/apk/debug/*.apk)
          echo "apk: $apk"
          unzip -l "$apk" > apk.txt
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for so in libmain.so libSDL2.so; do
              grep -q "lib/$abi/$so" apk.txt || {
                echo "missing lib/$abi/$so"
                exit 1
              }
            done
          done
          for asset in BITMAP/204.bmp Sounds/sblam.wav Musics/music1.tkm; do
            grep -q "assets/$asset" apk.txt || {
              echo "missing assets/$asset"
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-android
          path: build-android/app/build/outputs/apk/debug/*.apk

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest

      - name: Build
        run: |
          . ./emsdk/emsdk_env.sh
          sh tools/build_web.sh

      - name: Check the web payload
        run: |
          cd build-web
          for f in index.html index.js index.wasm; do
            test -s "$f" || {
              echo "missing or empty $f"
              exit 1
            }
          done
          # The assets are embedded (JB_EMBED) as data segments, so the wasm is
          # far larger than a code-only module; a tiny wasm means the embed step
          # silently dropped them.
          size=$(stat -c%s index.wasm)
          echo "index.wasm is $size bytes"
          test "$size" -gt 200000 || {
            echo "index.wasm is suspiciously small - embedded assets missing?"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-web
          path: |
            build-web/index.html
            build-web/index.js
            build-web/index.wasm

  windows-ce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # cegcc's prebuilt host binaries are 32-bit x86 ELF (gcc 4.4.0), so the
      # runner needs the i386 C/C++ runtime to run the cross compiler itself.
      - name: Install the i386 runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386

      # cc1 is gcc 4.4.0 and links against the old i386 sonames libgmp.so.3 and
      # libmpfr.so.1, which Ubuntu 24.04 no longer ships (it carries .so.10 and
      # .so.6).  The gcc driver alone never loads them, so --version passes while
      # the first real compile dies with "libmpfr.so.1: cannot open shared object
      # file".  Pull both from the Debian archive and point the 32-bit loader at
      # them for every later step.
      - name: Install libgmp.so.3 / libmpfr.so.1 for cc1
        run: |
          base=http://archive.debian.org/debian/pool/main
          curl -fsSL -o /tmp/gmp.deb  "$base/g/gmp/libgmp3c2_4.3.2+dfsg-1_i386.deb"
          curl -fsSL -o /tmp/mpfr.deb "$base/m/mpfr/libmpfr1ldbl_2.3.1.dfsg.1-2_i386.deb"
          dpkg -x /tmp/gmp.deb  "$GITHUB_WORKSPACE/cc1libs"
          dpkg -x /tmp/mpfr.deb "$GITHUB_WORKSPACE/cc1libs"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/cc1libs/usr/lib" >> "$GITHUB_ENV"

      - name: Cache the cegcc (mingw32ce) toolchain
        id: cegcc
        uses: actions/cache@v4
        with:
          path: /opt/mingw32ce
          key: mingw32ce-0.59.1

      # The tarball unpacks to opt/mingw32ce/, which is build_wince.sh's default
      # CEGCC prefix, so extract it at the filesystem root.
      - name: Fetch the arm-mingw32ce toolchain
        if: steps.cegcc.outputs.cache-hit != 'true'
        run: |
          url=https://downloads.sourceforge.net/project/cegcc/cegcc/0.59.1/mingw32ce-0.59.1.tar.bz2
          curl -fsSL -o /tmp/mingw32ce.tar.bz2 "$url"
          sudo tar -xjf /tmp/mingw32ce.tar.bz2 -C /

      # Compile a tiny file, not just --version: the driver never loads cc1, so
      # a bare --version passed even while cc1 was missing its shared libs.
      - name: Toolchain sanity check
        run: |
          /opt/mingw32ce/bin/arm-mingw32ce-gcc --version
          echo 'int probe(void){return 0;}' > /tmp/probe.c
          /opt/mingw32ce/bin/arm-mingw32ce-gcc -c /tmp/probe.c -o /tmp/probe.o
          echo "cc1 ran: $(file /tmp/probe.o)"

      # Two artifacts, mirroring the desktop windows job: the default build that
      # looks for BITMAP/Sounds/Musics beside the .exe, and the EMBED=1 build
      # that packs them in for a single self-contained jumpyball.exe.
      - name: Build (assets beside the exe)
        run: OUT=build-wince sh tools/build_wince.sh

      - name: Build (assets embedded, self-contained)
        run: OUT=build-wince-embed EMBED=1 sh tools/build_wince.sh

      - name: Confirm the outputs are ARM PE executables
        run: |
          for exe in build-wince/jumpyball.exe build-wince-embed/jumpyball.exe; do
            echo "$exe: $(file "$exe")"
            file "$exe" | grep -q 'PE32.*ARM' || {
              echo "$exe is not an ARM PE image"
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-windows-ce
          path: |
            build-wince/jumpyball.exe
            build-wince/BITMAP
            build-wince/Sounds
            build-wince/Musics
            build-wince-embed/jumpyball.exe

  gba:
    runs-on: ubuntu-24.04
    # devkitpro/devkitarm ships arm-none-eabi-gcc, gba.specs and gbafix with
    # DEVKITARM and DEVKITPRO already exported, the defaults build_gba.sh uses.
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the GBA ROM
        run: sh tools/build_gba.sh

      - name: Check the ROM header and payload
        run: |
          rom=build-gba/jumpyball.gba
          size=$(stat -c%s "$rom")
          echo "$rom is $size bytes"
          # GBATEK "GBA Cartridge Header": offset 0x04 begins the 156-byte
          # Nintendo logo, which starts 24 FF AE 51...; gbafix writes it, so a
          # 0x24 there proves the header was stamped.
          logo=$(od -An -tx1 -j4 -N1 "$rom" | tr -d ' ')
          echo "byte at 0x04: $logo"
          test "$logo" = "24" || {
            echo "no Nintendo logo at 0x04 - gbafix did not run"
            exit 1
          }
          # The assets are embedded (JB_EMBED), so a code-only ROM would be tiny;
          # a small ROM means the embed step silently dropped them.
          test "$size" -gt 200000 || {
            echo "ROM is suspiciously small - embedded assets missing?"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: jumpyball-gba
          path: build-gba/jumpyball.gba
